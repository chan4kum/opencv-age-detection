apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fd.fullname" . }}
  labels: {{- include "fd.labels" . | nindent 4 }}
data:
  AD_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  AD_SCORE_THRESHOLD: {{ .Values.config.scoreThreshold | quote }}
  AD_NMS_THRESHOLD: {{ .Values.config.nmsThreshold | quote }}
  AD_MAX_FACES: {{ .Values.config.maxFaces | quote }}
  AD_AGE_MIN_CONFIDENCE: {{ .Values.config.ageMinConfidence | quote }}
  AD_AGE_CROP_MARGIN: {{ .Values.config.ageCropMargin | quote }}
  AD_AGE_VIEWS: {{ .Values.config.ageViews | quote }}
  AD_ORT_INTRA_OP_THREADS: {{ .Values.config.ortIntraOpThreads | quote }}
  AD_INFERENCE_MAX_SIDE: {{ .Values.config.inferenceMaxSide | quote }}
  AD_MAX_UPLOAD_BYTES: {{ .Values.config.maxUploadBytes | int64 | quote }}
  AD_MAX_IMAGE_PIXELS: {{ .Values.config.maxImagePixels | int64 | quote }}
  AD_MAX_CONCURRENT_INFERENCE: {{ .Values.config.maxConcurrentInference | quote }}
  AD_INFERENCE_QUEUE_TIMEOUT_S: {{ .Values.config.inferenceQueueTimeoutS | quote }}
  AD_DOCS_ENABLED: {{ .Values.config.docsEnabled | quote }}
  AD_CORS_ALLOW_ORIGINS: {{ .Values.config.corsAllowOrigins | quote }}
  AD_JOB_TTL_S: {{ .Values.config.jobTtlS | quote }}
  AD_JOB_MAX_DELIVER: {{ .Values.config.jobMaxDeliver | quote }}
  AD_WORKER_CONCURRENCY: {{ .Values.config.workerConcurrency | quote }}
  AD_DELETE_INPUT_AFTER_PROCESSING: {{ .Values.config.deleteInputAfterProcessing | quote }}
  AD_NATS_PROVISION: "true"
